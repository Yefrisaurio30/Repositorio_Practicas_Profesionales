# ==============================================================================
# Modo PRODUCCIÓN (C4)
#   - Backend: gunicorn + collectstatic, usuario no root, healthcheck
#   - Frontend: build de Vite servido por nginx (usa frontend/nginx.conf)
#   - Postgres SIN puertos publicados (solo red interna)
#
# Uso:  docker compose -f docker-compose.prod.yml up --build -d
# Requiere en el entorno: SECRET_KEY, ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS,
# CSRF_TRUSTED_ORIGINS, DB_PASSWORD (ver .env.example).
# ============================================================================

services:
  db:
    image: postgres:15-alpine
    container_name: practicas_db_prod
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria en producción}
      POSTGRES_DB: ${DB_NAME:-proyeccion_social}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - practicas_network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-proyeccion_social}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: practicas_backend_prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SETTINGS_ENV: prod
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es obligatoria en producción}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS es obligatorio en producción}
      DB_NAME: ${DB_NAME:-proyeccion_social}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria en producción}
      DB_HOST: db
      DB_PORT: 5432
      IMAGE_STORAGE: ${IMAGE_STORAGE:-local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS es obligatorio}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-${CORS_ALLOWED_ORIGINS}}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
    volumes:
      - media_files:/app/media
    networks:
      - practicas_network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    container_name: practicas_frontend_prod
    ports:
      - "80:80"
    volumes:
      - media_files:/var/www/media:ro
    networks:
      - practicas_network
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  media_files:

networks:
  practicas_network:
    driver: bridge
