# ==============================================================================
# nginx - Frontend (React/Vite) en modo produccion
#
# Este archivo se monta en /etc/nginx/conf.d/default.conf dentro del
# contenedor del frontend. NO se usa en el perfil de desarrollo, donde el
# dev server de Vite hace el proxy.
#
# Hace 4 cosas:
#   1. Sirve el build de Vite (dist/) con fallback de SPA.
#   2. Proxea /api al backend Django.
#   3. Proxea /static a Django (whitenoise + collectstatic).
#   4. Sirve /media desde el volumen, porque Django solo expone media cuando
#      DEBUG=True (config/urls.py:17) y en produccion DEBUG es False.
# =============================================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # Limites de subida
    # El backend acepta hasta 10 MB (apps/imagenes/serializers.py) y el
    # frontend envia multipart/form-data. El default de nginx es 1 MB, que
    # devolveria 413 en casi todas las imagenes.
    # --------------------------------------------------------------------------
    client_max_body_size 10m;
    client_body_timeout  120s;
    client_body_buffer_size 256k;

    # --------------------------------------------------------------------------
    # Compresion
    # --------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # --------------------------------------------------------------------------
    # Cabeceras de seguridad
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Healthcheck del contenedor
    # --------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --------------------------------------------------------------------------
    # API Django
    #
    # El backend NO se declara en un bloque "upstream": al usar variables en
    # proxy_pass, nginx resuelve el nombre en cada request via el resolver, y
    # el nombre del upstream no es un dominio resoluble. Asi, si el contenedor
    # backend se reinicia y cambia de IP, nginx no se queda con la IP vieja.
    # 127.0.0.11 es el DNS interno de Docker.
    #
    # Ojo: con variable hay que pasar $request_uri a mano; si no, nginx no
    # reescribe el prefijo del location.
    # --------------------------------------------------------------------------
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;

        set $backend http://backend:8080;

        proxy_pass         $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # Subidas de imagenes: se deja el buffering por defecto (on) a
        # proposito. Con buffering off, client_max_body_size se valida durante
        # el streaming y el backend puede responder (403/400) antes de que
        # nginx alcance el limite, tapsando el 413 y confundiendolo todo.
        # Con buffering on, nginx rechaza de entrada con 413, que es lo que
        # espera el usuario al pasarse de los 10 MB. Con <=10 MB por subida el
        # uso de disco temporal es irrelevante.

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # --------------------------------------------------------------------------
    # Archivos estaticos de Django (collectstatic + whitenoise)
    # --------------------------------------------------------------------------
    location /static/ {
        resolver 127.0.0.11 valid=30s ipv6=off;

        set $backend http://backend:8080;

        proxy_pass         $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Imagenes subidas por los usuarios
    # Se sirven desde el volumen media_files montado en solo lectura, porque
    # Django no los expone con DEBUG=False.
    #
    # NOTA: los add_header de seguridad se repiten en cada location que define
    # su propio add_header. En nginx, un add_header a nivel de location
    # DESCARTA todos los add_header heredados del server; no se suman. Asi que
    # si se anaden mas cabeceras mas abajo, hay que repetirlas aqui tambien.
    # --------------------------------------------------------------------------
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Assets del build de Vite (nombre con hash) -> cache inmutable de 1 ano
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # index.html nunca se cachea: es quien apunta a los assets con hash, y
    # cachearlo dejaria a los usuarios en un build viejo de forma permanente.
    # --------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        expires 0;
    }

    # --------------------------------------------------------------------------
    # Fallback de SPA (BrowserRouter)
    # Sin esto, refrescar en /login o /publicaciones/5 daria 404.
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
