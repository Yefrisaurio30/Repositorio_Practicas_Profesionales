<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyección Social UNIMINUTO</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
    <style>
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased">
    <div id="root"></div>
    <div id="initial-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f2f5fa;z-index:9999;">
      <div style="text-align:center;">
        <div style="margin:0 auto 1.5rem;height:3rem;width:3rem;border:4px solid #e2e8f0;border-top-color:#1d4ed8;border-radius:9999px;animation:spin 1s linear infinite;"></div>
        <h1 style="font-size:1.25rem;font-weight:700;color:#1e3a8a;">El servidor se está levantando</h1>
        <p style="margin-top:0.5rem;font-size:0.875rem;color:#64748b;">Por favor, espera un momento...</p>
      </div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
